services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: store
      POSTGRES_USER: store
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup first}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U store -d store"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  api:
    build: .
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?Run npm run setup first}
      DATABASE_URL: postgresql://store:${POSTGRES_PASSWORD:?Run npm run setup first}@db:5432/store
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      ENABLE_SANDBOX_BILLING: "false"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    init: true
volumes:
  postgres_data:
